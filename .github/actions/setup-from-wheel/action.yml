---

name: Setup - Install python, pytest, uv, build & install wheel
description: Simulate an end-user installation of DSP-TOOLS. Specifically for the distribution tests.
runs:
  using: "composite"
  steps:
    - name: Install python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
    - name: Build wheels
      run: |
        echo ########### STEP: BUILD WHEELS ###########
        # dsp-tools depends on dsp-vre-lib, which is built from the same commit.
        uv build --package dsp-vre-lib
        uv build --package dsp-tools
      shell: bash
    - name: check the wheel for correctness, in dedicated venv
      run: |
        echo ########### STEP: CHECK WHEEL IN DEDICATED VENV ###########
        uvx check-wheel-contents dist/
      shell: bash
    - name: Install wheels globally
      run: |
        echo ########### STEP: INSTALL WHEELS GLOBALLY ###########
        # One command for both wheels, so that dsp-tools resolves dsp-vre-lib from dist/ and not from PyPI.
        uv pip install --system dist/*.whl
      shell: bash
    - name: Install pytest globally
      run: |
        echo ########### STEP: INSTALL PYTEST GLOBALLY ###########
        uv pip install --system pytest pytest-unordered
      shell: bash
