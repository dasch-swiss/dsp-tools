---

# Every step here is hermetic, which is what makes this job safe as a required
# status check on main. External links are checked by check-external-links.yml
# instead: they depend on third-party hosts, so a merge gate built on them
# fails for reasons unrelated to the pull request under test.
name: Check Docs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: check docstring links in xmllib
        run: just check-xmllib-docstring-links
      - name: markdownlint
        run: just markdownlint
      - name: build docs
        run: uv run mkdocs build --strict
