---

name: Check Docs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: check external links in docs
        uses: lycheeverse/lychee-action@v2
        with:
          # Same ./docs scope and lychee.toml config as `just check-links`.
          args: ./docs
      - name: check docstring links in xmllib
        run: just check-xmllib-docstring-links
      - name: markdownlint
        run: just markdownlint
      - name: build docs
        run: uv run mkdocs build --strict
