---

# Deliberately NOT a required status check on main: it reaches ~40 third-party hosts, so as a merge
# gate it fails for reasons unrelated to the pull request under test. A dead link still shows as a
# red ✗ to the author. Internal links and `#heading` anchors belong to `mkdocs build --strict` (the
# `validation:` block in mkdocs.yml), which is required precisely because it depends on nothing
# outside this repository.
name: Check External Links

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  check-external-links:
    # Neither bot-authored release PR changes documentation — release-please
    # bumps CHANGELOG/version/uv.lock, and the start-stack bump touches only
    # versions.env (see scripts/bump_stack_versions.py) — so there is nothing
    # here for them to check, and no reason to hang a red ✗ on a PR that merges
    # unattended.
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--')
      && !startsWith(github.head_ref, 'chore/bump-version-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7

      - name: Check external links in docs
        uses: lycheeverse/lychee-action@v2
        with:
          # Same ./docs scope and lychee.toml config as `just check-links`.
          args: ./docs
