---

# This check reaches third-party hosts, so it must never be able to block a
# merge: an outage at one host would otherwise stall every open PR in the repo.
name: Check External Links

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  check-external-links:
    # Neither bot-authored release PR changes documentation, so there is nothing
    # here for them to check.
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--')
      && !startsWith(github.head_ref, 'chore/bump-version-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7

      - name: Check external links in docs
        uses: lycheeverse/lychee-action@v2
        with:
          # Same ./docs scope and lychee.toml config as `just check-links`.
          args: ./docs
