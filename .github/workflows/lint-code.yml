---

name: Lint Code

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

# Skipped on release-please PRs: they change no Python and no YAML, so there is
# nothing here for ruff, mypy, vulture, yamllint or yamlfmt to look at. A skipped
# job counts as passing in branch protection.
jobs:
  lint:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: Linting with ruff
        run: just ruff-check --output-format=github
      - name: Check formatting with ruff
        run: just ruff-format-check
      - name: Linting with mypy
        run: just mypy
      - name: Find dead code with vulture
        run: just vulture
      - name: yamllint
        run: just yamllint
      - name: Check formatting of YAML files
        # Homebrew is pre-installed but not added to PATH.
        # See https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2204-Readme.md#homebrew-note
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install yamlfmt
          just yamlfmt-check
