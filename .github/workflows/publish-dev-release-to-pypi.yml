---

name: Publish dev-release to PyPI

on:
  push:
    branches:
      - main
    # Only a change to dsp-tools makes a dsp-tools dev release.
    paths:
      - packages/dsp-tools/**
  workflow_dispatch:

jobs:
  publish-dev-release-to-pypi:
    if: startsWith(github.event.head_commit.message, 'fix') || startsWith(github.event.head_commit.message, 'feat')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for PyPI trusted publishing
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install just
        uses: taiki-e/install-action@just
      - name: bump version in packages/dsp-tools/pyproject.toml
        run: uv run scripts/bump_version.py
      - name: build wheel
        run: uv build --package dsp-tools
      - name: publish new version to PyPI
        # PyPI trusted publishing: no long-lived token. See https://docs.pypi.org/trusted-publishers/
        run: uv publish --trusted-publishing always
