---

name: Publish dev-release to PyPI

# dsp-tools requires dsp-vre-lib. A dsp-tools dev release thus always comes with a dsp-vre-lib dev release
# from the same commit, and requires exactly that version.
# Prerequisite: PyPI trusted publishing for the project dsp-vre-lib,
# with this repository and this workflow file as a trusted publisher.
# See https://docs.pypi.org/trusted-publishers/

on:
  push:
    branches:
      - main
    paths:
      - packages/dsp-tools/**
      - packages/dsp-vre-lib/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-dev-release-to-pypi:
    if: startsWith(github.event.head_commit.message, 'fix') || startsWith(github.event.head_commit.message, 'feat')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for PyPI trusted publishing of dsp-vre-lib
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install just
        uses: taiki-e/install-action@just
      - name: bump version in packages/dsp-vre-lib/pyproject.toml
        run: uv run scripts/bump_version.py dsp-vre-lib
      - name: bump version in packages/dsp-tools/pyproject.toml, and pin dsp-vre-lib to the version above
        run: |
          uv run scripts/bump_version.py dsp-tools
          vre_lib_version=$(uv version --package dsp-vre-lib --short)
          uv run scripts/vre_lib_lower_bound.py pin "$vre_lib_version"
      - name: build wheels
        run: |
          uv build --package dsp-vre-lib
          uv build --package dsp-tools
      # A PyPI version cannot be re-uploaded, so this is the last reversible moment.
      - name: check the wheels for correctness
        run: uvx check-wheel-contents dist/
      # dsp-vre-lib goes first: the dsp-tools dev release requires it.
      - name: publish dsp-vre-lib to PyPI
        run: uv publish --trusted-publishing always "dist/dsp_vre_lib-*"
      - name: publish dsp-tools to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_DASCHBOT_TOKEN }}
        run: uv publish "dist/dsp_tools-*"
