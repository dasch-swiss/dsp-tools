---

name: Tests e2e

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

# Release-please PRs (head branch `release-please--*`) change no source, so
# every job below skips them. The guard is job-level on purpose: a required
# check skipped by a job-level `if:` counts as passing in branch protection,
# where one skipped by a `branches`/`paths` filter hangs Pending and blocks the
# PR.
#
# The predicate keys on the HEAD BRANCH on purpose. Do NOT rewrite it as a
# bot-author check: the start-stack bump PR (`chore/bump-version-*`) is
# bot-authored too and is the one PR that MUST run these jobs. It changes
# src/dsp_tools/resources/start-stack/versions.env, where
# test/e2e/setup_testcontainers/setup.py reads the image tags from, so this
# suite is the only validation of dsp-tools against a newly released DSP stack.
env:
  DSP_TOOLS_TESTING: true
  # Literal, not a secret: Dependabot PRs cannot read Actions secrets, and this value only creates
  # a test user on an ephemeral DSP-API stack.
  DSP_USER_PASSWORD: pw

jobs:
  ingest-xmlupload:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: ingest-xmlupload
        run: just e2e-test-ingest-xmlupload
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-ingest-xmlupload-logging.log
          path: logging.log
          compression-level: 0

  validate-data:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: validate-data
        run: just e2e-test-validate-data
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-validate-data-logging.log
          path: logging.log
          compression-level: 0

  xmlupload:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: xmlupload
        run: just e2e-test-xmlupload
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-xmlupload-logging.log
          path: logging.log
          compression-level: 0

  project:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: project
        run: just e2e-test-project
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-project-logging.log
          path: logging.log
          compression-level: 0

  mapping:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: mapping
        run: just e2e-test-mapping
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-mapping-logging.log
          path: logging.log
          compression-level: 0

  create-get-xmlupload:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: create-get-xmlupload
        run: just e2e-test-create-get-xmlupload
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-create-get-xmlupload-logging.log
          path: logging.log
          compression-level: 0

  legacy:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: start stack
        run: uv run dsp-tools start-stack --no-prune --with-test-data
      - name: legacy
        run: just legacy-e2e-tests
      - name: stop stack  # see if this command can run (it isn't tested anywhere else)
        run: uv run dsp-tools stop-stack
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-legacy-logging.log
          path: logging.log
          compression-level: 0
