---

name: Tests e2e

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

# Release-please PRs (head branch `release-please--*`) bump only CHANGELOG.md,
# pyproject.toml, the release-please manifest and uv.lock — the source is
# identical to a main that already passed these very jobs on the feature PRs
# behind it, so re-running them proves nothing and costs ~4 minutes of
# time-to-green on the release train. Every job below is therefore skipped for
# them. A required check skipped by a job-level `if:` counts as passing in
# branch protection, so the release PR stays mergeable. (A workflow skipped by
# `branches`/`paths` filters would instead leave the check Pending forever and
# block the PR — hence the job-level guard rather than a trigger filter.)
#
# The predicate keys on the HEAD BRANCH on purpose. Do NOT rewrite it as a
# bot-author check: the start-stack bump PR (`chore/bump-version-*`) is
# bot-authored too, and it is the one PR that MUST run these jobs. It changes
# src/dsp_tools/resources/start-stack/versions.env, which is exactly where
# test/e2e/setup_testcontainers/setup.py reads the DSP-API / Sipi / Ingest /
# Fuseki image tags from — so this suite is the only thing that validates
# dsp-tools against a newly released DSP stack before dsp-tools is released
# against it.
env:
  DSP_TOOLS_TESTING: true
  # Literal, not a secret: Dependabot PRs cannot read Actions secrets, and this value only creates
  # a test user on an ephemeral DSP-API stack.
  DSP_USER_PASSWORD: pw

jobs:
  ingest-xmlupload:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: ingest-xmlupload
        run: just e2e-test-ingest-xmlupload
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-ingest-xmlupload-logging.log
          path: logging.log
          compression-level: 0

  validate-data:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: validate-data
        run: just e2e-test-validate-data
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-validate-data-logging.log
          path: logging.log
          compression-level: 0

  xmlupload:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: xmlupload
        run: just e2e-test-xmlupload
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-xmlupload-logging.log
          path: logging.log
          compression-level: 0

  project:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: project
        run: just e2e-test-project
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-project-logging.log
          path: logging.log
          compression-level: 0

  mapping:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: mapping
        run: just e2e-test-mapping
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-mapping-logging.log
          path: logging.log
          compression-level: 0

  create-get-xmlupload:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: create-get-xmlupload
        run: just e2e-test-create-get-xmlupload
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-create-get-xmlupload-logging.log
          path: logging.log
          compression-level: 0

  legacy:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: start stack
        run: uv run dsp-tools start-stack --no-prune --with-test-data
      - name: legacy
        run: just legacy-e2e-tests
      - name: stop stack  # see if this command can run (it isn't tested anywhere else)
        run: uv run dsp-tools stop-stack
      - name: make logging file available
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-legacy-logging.log
          path: logging.log
          compression-level: 0
