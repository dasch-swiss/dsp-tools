---

name: Tests

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

env:
  DSP_TOOLS_TESTING: true

# A release-please PR changes no source, so these jobs skip it.
#
# `distribution` skips too: the failure modes it catches (an unshipped
# dependency or resource file) arrive with a source change and are caught on the
# PR that introduces them. The published artifact is checked at publish time
# instead, in publish-release-to-pypi.yml.
#
# Exception: vre-lower-bound-on-pypi runs only on the dsp-tools release PR.
jobs:
  unittests:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: unittests
        run: just unittests --cov=dsp_tools --cov-report xml
      - name: save coverage report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unittests
          path: packages/dsp-tools/coverage.xml

  integration:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: integration-tests
        run: just integration-tests --cov=dsp_tools --cov-report xml
      - name: save coverage report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: packages/dsp-tools/coverage.xml

  vre-unittests:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: dsp-vre unittests
        run: just vre-unittests --cov=dsp_vre --cov-report xml
      - name: save coverage report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-vre-unittests
          path: packages/dsp-vre/coverage.xml

  upload-coverage:
    runs-on: ubuntu-latest
    needs: [unittests, integration, vre-unittests]
    steps:
      - name: download unittests coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-unittests
          path: coverage/unittests
      - name: download integration coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-integration
          path: coverage/integration
      - name: upload unittests coverage to codecov.io
        uses: codecov/codecov-action@v7
        with:
          files: coverage/unittests/coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
      - name: download dsp-vre unittests coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-vre-unittests
          path: coverage/vre-unittests
      - name: upload integration coverage to codecov.io
        uses: codecov/codecov-action@v7
        with:
          files: coverage/integration/coverage.xml
          flags: integration-tests
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
      - name: upload dsp-vre unittests coverage to codecov.io
        uses: codecov/codecov-action@v7
        with:
          files: coverage/vre-unittests/coverage.xml
          flags: dsp-vre
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  scripts-tests:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: tests of the repository tooling in scripts/
        run: just scripts-tests

  # Runs only on the dsp-tools release PR: a dsp-tools release must not require a dsp-vre that is not on PyPI.
  vre-lower-bound-on-pypi:
    runs-on: ubuntu-latest
    if: ${{ endsWith(github.head_ref, '--components--dsp-tools') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: check that the dsp-vre lower bound of dsp-tools is on PyPI
        run: uv run python scripts/vre_lower_bound.py check-on-pypi

  benchmarking:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install uv, just, and dependencies
        uses: ./.github/actions/setup
      - name: benchmarking
        working-directory: packages/dsp-tools
        run: uv run pytest -s test/benchmarking/

  distribution:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout dsp-tools repo
        uses: actions/checkout@v7
      - name: Install python, pytest, uv, build & install wheel
        uses: ./.github/actions/setup-from-wheel
      - name: start stack
        run: uv run dsp-tools start-stack --no-prune --with-test-data
      - name: distribution tests
        working-directory: packages/dsp-tools
        run: python -m pytest --noconftest test/distribution/
        # Reason for the --noconftest flag: 
        # test/conftest.py configures logging, but loguru should not be installed for the distribution tests
      - name: stop stack
        run: uv run dsp-tools stop-stack
