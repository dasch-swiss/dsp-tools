# Configuration for `just check-links` (see .github/workflows/check-external-links.yml).
#
# Internal links and `#heading` anchors are NOT validated here — `mkdocs build
# --strict` owns those (see the `validation:` block in mkdocs.yml) and uses the
# site's real slug algorithm. Leaving `include_fragments` off keeps this file
# from second-guessing it with a different one.

no_progress = true

# Retry before declaring a link dead, and treat "rate limited" as alive: one
# transient Cloudflare challenge would otherwise fail the whole run.
max_retries = 3
retry_wait_time = 5
timeout = 30
accept = ["200..=204", "429"]

# Gentler than the default 14, which is itself a cause of rate-limiting.
max_concurrency = 8

# The local-stack docs link to 0.0.0.0:3333 and friends, which exist only on a
# developer machine.
exclude_all_private = true

exclude = [
    # Cloudflare-protected: answers 403 to any non-browser client, with or
    # without a custom user agent.
    '^https?://(www\.)?stackoverflow\.com',
]
