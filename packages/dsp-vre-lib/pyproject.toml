[project]
name = "dsp-vre-lib"
version = "0.0.0"
description = "dsp-vre-lib is a Python client library for the DSP-API of a DaSCH Service Platform (DSP) server."
authors = [
    { name = "DaSCH - Swiss National Data and Service Center for the Humanities", email = "info@dasch.swiss" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "loguru~=0.7.3", # non-dev dependencies < 1.0 should be pinned to a specific minor version to avoid breaking changes
    "rdflib",
    "regex",
    "requests",
]


[project.urls]
Homepage = "https://www.dasch.swiss/"
Repository = "https://github.com/dasch-swiss/dsp-tools.git"


[build-system]
requires = ["uv_build>=0.8.13"]
build-backend = "uv_build"


[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = [".", "src", "test"]
filterwarnings = [
    # pytest looks up "_mock_name" on each module attribute, and the rdflib namespace XSD warns about unknown names.
    "ignore:Code. _mock_name is not defined in namespace XSD:UserWarning",
    # The rdflib JSON-LD parser uses ConjunctiveGraph internally. This is not in our code.
    "ignore:ConjunctiveGraph is deprecated:DeprecationWarning:rdflib.plugins.parsers.jsonld",
]


[tool.mypy]
python_version = "3.12"
show_column_numbers = true
strict = true
enable_error_code = ["possibly-undefined"]


[[tool.mypy.overrides]]
module = ["test/*"]
disable_error_code = ["no-untyped-def", "method-assign"]


[tool.ruff]
extend = "../../pyproject.toml"


[tool.ruff.lint.extend-per-file-ignores]
"test/*" = [
    "S101",    # flake8-bandit: use of assert
    "PLC2701", # import of private function
    "D103",    # pydocstyle: undocumented-public-function
]


[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The dependency goes in one direction only: dsp-tools uses dsp-vre-lib, never the reverse.
"dsp_tools".msg = "dsp_vre_lib must not import dsp_tools"
