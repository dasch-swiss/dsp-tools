# Virtual workspace root: it holds the workspace definition, the dev dependencies and the shared ruff configuration.
# Each package in `packages/` has its own `pyproject.toml` with its metadata, and its pytest, mypy and vulture configuration.
# pytest and mypy run per package, with the package folder as the working directory,
# because the tests use paths relative to the working directory.

[tool.uv.workspace]
members = ["packages/*"]


[dependency-groups]
dev = [
    "docker",
    "mkdocs-include-markdown-plugin",
    "mkdocs-material",
    "mkdocs",
    "mkdocstrings[python]",
    "mypy",
    "pandas-stubs",
    "pre-commit",
    "pytest-cov",
    "pytest-unordered",
    "pytest-xdist",
    "pytest",
    "requests-mock",
    "ruff",
    "testcontainers",
    "tomlkit",
    "types-docker",
    "types-jsonschema",
    "types-lxml",
    "types-networkx",
    "types-openpyxl",
    "types-pyyaml",
    "types-regex",
    "types-requests",
    "types-tqdm",
    "viztracer",
    "vulture",
    "yamllint",
    "pytest-order",
]


[tool.pytest.ini_options]
# Tests of the repository tooling in `scripts/`.
# The tests of each package run from the package folder (`just dsp-tools-pytest`), with the config of the package.
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["scripts/test"]


[tool.mypy]
# Type checking of the repository tooling in `scripts/` (`just mypy-scripts`).
# Each package has its own mypy configuration.
python_version = "3.12"
show_column_numbers = true
strict = true
enable_error_code = ["possibly-undefined"]



[tool.ruff]
line-length = 120
# first-party modules for isort: the repository tooling and the source folder of each package
src = [".", "packages/*/src"]
target-version = "py312"


[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "RUF",   # ruff-specific rules
    "PL",    # pylint
    "I",     # isort
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "A",     # flake8-builtins
    "BLE",   # flake8-blind-except
    "ARG",   # flake8-unused-arguments
    "S",     # flake8-bandit plugin which checks for security issues
    "YTT",   # flake8-2020 plugin, which checks for misuse of `sys.version` or `sys.version_info`
    "ASYNC", # flake8-async plugin, which checks for bad async / asyncio practices
    "ISC",   # flake8-implicit-str-concat plugin, which checks for problematic string concatenation
    "INP",   # flake8-no-pep420 plugin, which checks for missing __init__.py files
    "PIE",   # flake8-pie plugin, which does miscellaneous checks
    "PT",    # flake8-pytest-style plugin
    "TID",   # flake8-tidy-imports plugin
    "ICN",   # flake8-import-conventions plugin, which checks for import conventions
    "PGH",   # pygrep-hooks: A collection of fast, cheap, regex based pre-commit hooks
    "UP",    # pyupgrade
    "D101",  # pydocstyle: undocumented-public-class
    "D102",  # pydocstyle: undocumented-public-method
    "D103",  # pydocstyle: undocumented-public-function
    "D417",  # pydocstyle: undocumented-param
    "B023",  # flake8-bugbear: function-uses-loop-variable
    "FIX",   # flake8-fixme: checks for FIXME, TODO, XXX, etc.
    "N818",  # pep8-naming: exception name must end in "Error"
]
ignore = [
    "ISC001", # flake8-implicit-str-concat: single-line-implicit-string-concatenation  # incompatible with the formatter
    "S105",   # flake8-bandit: hardcoded password
    "S106",   # flake8-bandit: hardcoded password
    "S603",   # flake8-bandit: subprocess-without-shell-equals-true
    "UP007",  # forbid use of typing.Union and typing.Optional
    "UP015",  # Unnecessary mode="r" argument in open()
    "UP045",  # Forced use of "|" instead of typing.Optional and typing.Union
]
extend-select = [  # this is for preview (beta) features
   "DOC102", # pydoclint: docstring contains more arguments than function signature
   "DOC501", # pydoclint: docstring-missing-exception
]


[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "S607",   # flake8-bandit: start-process-with-partial-path  # scripts invoke git/gh by name intentionally
    "D103",   # pydocstyle: undocumented-public-function
    "DOC501", # pydoclint: docstring-missing-exception
]
"scripts/test/**" = [
    "S101", # flake8-bandit: use of assert
    "PLC2701" # import of private function
]
"__init__.py" = [
    "F401",    # unused-import
    "F403",    # undefined-local-with-import-star
    "PLC0414", # useless-import-alias
]


[tool.ruff.lint.pylint]
max-args = 8


[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.lint.isort]
force-single-line = true
